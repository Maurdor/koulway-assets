<!DOCTYPE html><html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koulway</title>
<link rel="manifest" id="mf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Koulway">
<link rel="apple-touch-icon" href="icon-180.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=3">
<meta name="theme-color" content="#0E6E78">
<style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#F5F4F2;margin:0;padding:56px 22px;text-align:center;color:#1A1A1A}
img.lg{width:96px;height:96px}h1{font-size:19px;margin:14px 0 6px}p{font-size:13.5px;color:#555;line-height:1.55;max-width:340px;margin:8px auto}
.etape{background:#fff;border-radius:12px;padding:14px;margin:10px auto;max-width:340px;text-align:left;font-size:13.5px;box-shadow:0 1px 2px rgba(0,0,0,.06)}</style>
</head><body>
<img class="lg" src="icon-192.png?v=3" alt="Koulway">
<h1>Koulway</h1>
<div id="aide" style="display:none">
  <p><b>Tu es au bon endroit — ajoute l'app à ton écran d'accueil :</b></p>
  <div class="etape" id="etapes"></div>
  <p>Ensuite, ouvre toujours le hub depuis cette icône.</p>
  <p><a id="retour" href="#" style="display:none;color:#0E6E78;font-weight:700;text-decoration:none">&larr; Revenir au hub</a></p>
</div>
<p id="chg">Ouverture du hub…</p>
<script>
// La cible (URL du hub) n'est JAMAIS écrite dans ce dépôt public. Elle
// arrive du bouton « Préparer l'icône » du hub (#fragment), puis est
// EMBARQUÉE dans l'icône elle-même : en mode installation, un manifest
// dynamique (data:) fixe start_url = go.html?go=<cible> — le raccourci
// n'a donc besoin d'aucun stockage pour retrouver le hub. localStorage
// reste un simple secours.
(function(){
  var OK=/^https:\/\/script\.google\.com\//;
  function param(n){var m=location.search.match(new RegExp('[?&]'+n+'=([^&]+)'));return m?decodeURIComponent(m[1]):'';}
  var cible=param('go');
  if(!OK.test(cible)){cible=location.hash?decodeURIComponent(location.hash.slice(1)):'';}
  if(!OK.test(cible)){try{cible=localStorage.getItem('KW_GO')||'';}catch(e){}}
  if(!OK.test(cible)){cible='';}
  if(cible){try{localStorage.setItem('KW_GO',cible);}catch(e){}}
  // iOS : l'app épinglée a un stockage SÉPARÉ de Safari → la cible doit
  // vivre dans l'URL (?go=), jamais seulement dans localStorage.
  var start=location.origin+location.pathname+(cible?'?go='+encodeURIComponent(cible):'');
  var mfObj={name:'Koulway',short_name:'Koulway',display:'standalone',background_color:'#F5F4F2',theme_color:'#0E6E78',
    start_url:start,
    icons:[{src:location.origin+'/koulway-assets/icon-192.png?v=3',sizes:'192x192',type:'image/png'},
           {src:location.origin+'/koulway-assets/icon-512.png?v=3',sizes:'512x512',type:'image/png'},
           {src:location.origin+'/koulway-assets/icon-512-maskable.png?v=3',sizes:'512x512',type:'image/png',purpose:'maskable'}]};
  document.getElementById('mf').setAttribute('href','data:application/manifest+json,'+encodeURIComponent(JSON.stringify(mfObj)));
  var setup=/[?&]setup=1/.test(location.search);
  var standalone=(navigator.standalone===true)||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
  if(setup&&!standalone){
    document.getElementById('chg').style.display='none';
    var ios=/iPad|iPhone|iPod/.test(navigator.userAgent);
    document.getElementById('etapes').innerHTML=ios
      ?'1. Appuie sur <b>Partager</b> &#x2934;<br>2. Choisis <b>&laquo; Sur l’écran d’accueil &raquo;</b><br>3. Confirme &laquo; Ajouter &raquo; — le logo K apparaît.'
      :'1. Ouvre le menu <b>&#8942;</b> de Chrome<br>2. Choisis <b>&laquo; Ajouter à l’écran d’accueil &raquo;</b><br>3. Confirme — le logo K apparaît.';
    document.getElementById('aide').style.display='block';
    if(cible){var rt=document.getElementById('retour');rt.href=cible;rt.style.display='inline-block';}
    return;
  }
  if(cible){location.replace(cible);return;}
  document.getElementById('chg').innerHTML='Ouvre d’abord ton espace Koulway depuis ton lien de connexion, puis appuie sur <b>&laquo; Préparer l’icône &raquo;</b> — ensuite cette icône ouvrira le hub directement.';
})();
</script></body></html>
